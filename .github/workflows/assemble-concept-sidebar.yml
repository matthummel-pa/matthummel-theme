name: Assemble concept sidebar files
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/sidebar-parts/ASSEMBLE'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/product-landing-pages-f168
          fetch-depth: 0
      - name: Assemble and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, hashlib, pathlib, zlib
          root = pathlib.Path('.github/sidebar-parts')
          blade = zlib.decompress(base64.b64decode(''.join((root / f'b{i}').read_text().strip() for i in range(15))))
          php = zlib.decompress(base64.b64decode(''.join((root / f'p{i}').read_text().strip() for i in range(22))))
          assert hashlib.sha256(blade).hexdigest() == 'a6bca752f9bb5e5b3918f27603b4ad91e1c36c3415fcc69a8cafec9d9d401f7c'
          assert hashlib.sha256(php).hexdigest() == 'f138b9747ec84553223be3900669a7610b316ecf5467fbadee733293534022e9'
          assert b'concept-aside-card--facts' in blade
          assert b'mh_project_sidebar_sync_from_github' in php
          pathlib.Path('resources/views/partials/content-single-project.blade.php').write_bytes(blade)
          pathlib.Path('app/concept-sidebar.php').write_bytes(php)
          print('ok', len(blade), len(php))
          PY
          git config user.name "matt-hummel"
          git config user.email "matt@matthummel.com"
          git add resources/views/partials/content-single-project.blade.php app/concept-sidebar.php
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Add concept sidebar custom fields with GitHub sync"
          git push origin HEAD:cursor/product-landing-pages-f168
