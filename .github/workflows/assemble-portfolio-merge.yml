name: Assemble merged portfolio.php
on:
  push:
    paths:
      - '.github/portfolio-merge-parts/**'
      - '.github/workflows/assemble-portfolio-merge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/product-landing-pages-f168
      - name: Assemble portfolio and cleanup
        run: |
          python3 << 'PY'
          import base64, pathlib, zlib
          root = pathlib.Path('.github/portfolio-merge-parts')
          b64 = ''.join((root/f'zport.{i}').read_text() for i in range(7))
          raw = zlib.decompress(base64.b64decode(b64))
          assert raw.startswith(b'<?php')
          assert b'Sell this as a product' in raw
          pathlib.Path('app/portfolio.php').write_bytes(raw)
          print('portfolio', len(raw))
          PY
          rm -rf .github/portfolio-merge-parts
          rm -f .github/workflows/assemble-portfolio-merge.yml
          git config user.name "matt-hummel"
          git config user.email "matt@matthummel.com"
          git add -A
          git commit -m "Merge main portfolio.php (featured image) with product landing fields"
          git push origin HEAD:cursor/product-landing-pages-f168
