name: Assemble portfolio.php

on:
  push:
    paths:
      - 'app/.assemble-portfolio'
    branches:
      - 'cursor/product-landing-pages-f168'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/product-landing-pages-f168
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize portfolio.php from zlib parts
        run: |
          python3 << 'PY'
          import base64, zlib, hashlib, pathlib, os
          app = pathlib.Path('app')
          b64 = ''
          for i in range(4):
              part = app / f'portfolio.zlib.b64.{i}'
              b64 += part.read_text()
          fixes = {782: 'N', 3922: '9', 17614: 'f', 22818: 'l', 22819: 't'}
          chars = list(b64)
          for pos, ch in fixes.items():
              chars[pos] = ch
          code = zlib.decompress(base64.b64decode(''.join(chars)))
          expected = 'd5f135da57869e09cedb33fd09decf52ab11acdfb0a347f09f7ae16df32cc1ab'
          got = hashlib.sha256(code).hexdigest()
          print('sha256', got)
          if got != expected:
              raise SystemExit(f'hash mismatch: {got}')
          if b'Sell this as a product' not in code:
              raise SystemExit('missing marker')
          (app / 'portfolio.php').write_bytes(code)
          for i in range(4):
              (app / f'portfolio.zlib.b64.{i}').unlink(missing_ok=True)
          (app / '.assemble-portfolio').unlink(missing_ok=True)
          wf = pathlib.Path('.github/workflows/assemble-portfolio.yml')
          wf.unlink(missing_ok=True)
          print('assembled ok', len(code))
          PY

      - name: Commit assembled portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Replace portfolio zlib loader with full Pint-clean portfolio.php"
          git push origin HEAD:cursor/product-landing-pages-f168
