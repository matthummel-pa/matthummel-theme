name: Restore resolved conflict files after main merge
on:
  push:
    paths: ['.github/workflows/assemble-restore-res.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/product-landing-pages-f168
          fetch-depth: 0
      - run: |
          RESOLVED=58ea3c010dd79d9c421bb8c7961198d5a657eef0
          git show "$RESOLVED:app/concept-pages.php" > app/concept-pages.php
          git show "$RESOLVED:resources/views/partials/content-single-project.blade.php" > resources/views/partials/content-single-project.blade.php
          git show "$RESOLVED:app/portfolio.php" > app/portfolio.php
          python3 << 'PY'
          from pathlib import Path
          c = Path('app/concept-pages.php').read_bytes()
          b = Path('resources/views/partials/content-single-project.blade.php').read_bytes()
          p = Path('app/portfolio.php').read_bytes()
          assert b"return 'projects'" in c
          assert b'mh_project_product_type' in c
          assert b'app/shop.php' in c
          assert b'app/concept-sidebar.php' in c
          assert b'concept-aside-card--facts' in b
          assert b'Sell this as a product' in p
          assert b'<<<<<<' not in c + b + p
          assert len(p) == 127022
          print('ok', len(c), len(b), len(p))
          PY
          rm -f .github/workflows/assemble-restore-res.yml \
                .github/workflows/sync-main-conflicts.yml
          git config user.name matt-hummel
          git config user.email matt@matthummel.com
          git add -A
          git commit -m "Resolve merge conflicts with /projects routes and product sidebars" || true
          git push origin HEAD:cursor/product-landing-pages-f168
