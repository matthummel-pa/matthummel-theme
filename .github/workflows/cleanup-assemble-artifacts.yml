name: Cleanup assemble artifacts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/product-landing-pages-f168
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary assemble junk
        run: |
          set -euo pipefail
          rm -rf .github/sidebar-parts
          rm -f .github/workflows/assemble-concept-sidebar.yml
          rm -f .github/workflows/patch-portfolio-label.yml
          rm -f .github/workflows/patch-portfolio-placeholder.yml
          rm -f .github/workflows/cleanup-assemble-artifacts.yml
          # Keep real product files and ci/deploy
          test -f app/concept-sidebar.php
          test -f resources/views/partials/content-single-project.blade.php
          test -f resources/css/product-landing.css
          test -f app/portfolio.php
          test -f .github/workflows/ci.yml
          test -f .github/workflows/deploy.yml
          grep -q 'concept-aside-card--facts' resources/views/partials/content-single-project.blade.php
          SIZE=$(wc -c < app/concept-sidebar.php)
          echo "concept-sidebar.php bytes=$SIZE"
          test "$SIZE" -gt 20000
          git config user.name "matt-hummel"
          git config user.email "matt@matthummel.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing left to delete"
            exit 0
          fi
          git commit -m "Remove temporary concept-sidebar assemble artifacts"
          git push origin HEAD:cursor/product-landing-pages-f168
