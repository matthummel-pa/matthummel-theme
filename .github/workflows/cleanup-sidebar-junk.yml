name: Cleanup sidebar assemble junk
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-sidebar-junk.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/product-landing-pages-f168
      - name: Delete junk and push
        run: |
          set -e
          rm -rf .github/sidebar-parts
          rm -f .github/workflows/assemble-concept-sidebar.yml
          rm -f .github/workflows/cleanup-sidebar-junk.yml
          test -f app/concept-sidebar.php
          grep -q mh_project_sidebar_sync_from_github app/concept-sidebar.php
          grep -q concept-aside-card--facts resources/views/partials/content-single-project.blade.php
          git config user.name "matt-hummel"
          git config user.email "matt@matthummel.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to clean"; exit 0; fi
          git commit -m "Delete temporary sidebar assemble parts"
          git push origin HEAD:cursor/product-landing-pages-f168
