name: Deploy Roots Production Ecosystem

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-theme-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Build Assets & Publish Theme Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Install Composer Dependencies (Production Mode)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Theme Dependencies & Compile Production Assets
        run: |
          npm ci
          npm run build

      - name: Pack WordPress theme zip
        run: bash .github/scripts/pack-theme.sh "$GITHUB_WORKSPACE/matthummel.zip"

      - name: Publish GitHub Release (theme-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: theme-latest
          name: Latest theme build
          body: |
            Built Sage theme (Composer vendor + Vite `public/build`).
            Commit: ${{ github.sha }}
            Production: https://hummelwp.com (Hostinger).
            Install from wp-admin → Appearance → Update Theme, or `wp mh theme-update`.
            Unzip into `wp-content/themes/matthummel/` via Hostinger File Manager if needed.
          files: matthummel.zip
          fail_on_unmatched_files: true
          make_latest: true
          target_commitish: ${{ github.sha }}

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: matthummel-theme
          path: matthummel.zip
          if-no-files-found: error
