name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Node dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      # Parallel lftp is much faster than file-by-file FTP-Deploy-Action
      # (~5k files in vendor/). Same SITEGROUND_FTP_* secrets.
      - name: Upload theme over FTP
        env:
          FTP_HOST: ${{ secrets.SITEGROUND_FTP_HOST }}
          FTP_USER: ${{ secrets.SITEGROUND_FTP_USER }}
          FTP_PASS: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.SITEGROUND_FTP_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lftp
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > "$HOME/.netrc"
          lftp "ftp://$FTP_HOST" -e "
            set ssl:verify-certificate no
            set ftp:passive-mode true
            set net:max-retries 3
            set net:timeout 30
            set xfer:clobber on
            cd $FTP_DIR
            lcd $GITHUB_WORKSPACE
            mirror -R --parallel=12 --no-perms --no-umask \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob .cursor/ \
              --exclude-glob docs/ \
              --exclude-glob tests/
            bye
          "
