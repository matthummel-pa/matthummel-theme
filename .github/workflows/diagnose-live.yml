name: Diagnose Live 500

on:
  workflow_dispatch:

concurrency:
  group: diagnose-live
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check matthummel.com HTTP and REST
        run: |
          set -euo pipefail
          echo "GET https://matthummel.com/"
          curl -sI -L --max-time 20 https://matthummel.com/ | tee /tmp/home-headers.txt
          code=$(curl -sI -L --max-time 20 -o /dev/null -w '%{http_code}' https://matthummel.com/)
          echo "Homepage HTTP $code"
          test "$code" = "200"

          echo ""
          echo "GET https://matthummel.com/wp-json/"
          curl -sI -L --max-time 20 https://matthummel.com/wp-json/ | tee /tmp/json-headers.txt
          json_code=$(curl -sI -L --max-time 20 -o /dev/null -w '%{http_code}' https://matthummel.com/wp-json/)
          echo "REST HTTP $json_code"
          test "$json_code" = "200"

          if ! grep -qi 'platform: hostinger' /tmp/home-headers.txt; then
            echo "Warning: expected Hostinger platform header, continuing."
          fi
