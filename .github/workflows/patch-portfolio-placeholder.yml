name: Patch portfolio case URL placeholder
on:
  push:
    paths:
      - '.github/sidebar-parts/PATCH_PORTFOLIO_PH'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/product-landing-pages-f168
      - name: Patch placeholder
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/portfolio.php')
          t = p.read_text(encoding='utf-8')
          old = "mh_project_admin_field_row(__('GitHub / case URL', 'sage'), 'mh_project_concept', $concept, 'https://', 'url');"
          new = "mh_project_admin_field_row(__('GitHub / case URL', 'sage'), 'mh_project_concept', $concept, 'https://github.com/\u2026 or legacy case URL', 'url');"
          # Prefer unicode ellipsis char
          new = "mh_project_admin_field_row(__('GitHub / case URL', 'sage'), 'mh_project_concept', $concept, 'https://github.com/\u2026 or legacy case URL', 'url');"
          new = old.replace("'https://'", "'https://github.com/\u2026 or legacy case URL'")
          if "'https://github.com/\u2026 or legacy case URL'" in t or 'https://github.com/… or legacy case URL' in t:
              print('already has placeholder'); raise SystemExit(0)
          if old not in t:
              raise SystemExit('target row not found')
          t2 = t.replace(old, new, 1)
          p.write_text(t2, encoding='utf-8')
          print('placeholder patched', len(t2))
          PY
          git config user.name "matt-hummel"
          git config user.email "matt@matthummel.com"
          git pull --rebase origin cursor/product-landing-pages-f168 || true
          git add app/portfolio.php
          git commit -m "Update GitHub / case URL field placeholder" || echo no-commit
          git push origin HEAD:cursor/product-landing-pages-f168
