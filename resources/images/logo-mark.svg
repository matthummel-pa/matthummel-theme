<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mhTitle">
  <title id="mhTitle">Matt Hummel</title>
  <desc>Square MH mark. Scales with its box. Brighter strokes when the system is in dark mode.</desc>
  <style>
      svg { max-width: 100%; height: auto; }
      .mh-on-dark { display: none; }
      @media (prefers-color-scheme: dark) {
        .mh-on-light { display: none; }
        .mh-on-dark { display: block; }
      }
    </style>
  <defs>
    <linearGradient id="mhLight" x1="6" y1="8" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="mhDark" x1="6" y1="8" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
  </defs>
  <g class="mh-on-light"><g stroke="url(#mhLight)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16" stroke-width="1.75"/>
      <path d="M14 46V22l9.5 12 9.5-12v24" stroke-width="2.25"/>
      <path d="M40 22v24M52 22v24M40 34h12" stroke-width="2.25"/>
    </g></g>
  <g class="mh-on-dark"><g stroke="url(#mhDark)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16" stroke-width="1.75"/>
      <path d="M14 46V22l9.5 12 9.5-12v24" stroke-width="2.25"/>
      <path d="M40 22v24M52 22v24M40 34h12" stroke-width="2.25"/>
    </g></g>
</svg>
